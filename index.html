<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Başvurusu</title>
    
    <style>
        /* Tüm sayfanın (arkaplanın) tasarımı */
        body {
        /* --- YENİ EKLENEN ARKA PLAN KODLARI --- */
            background-image: url('background.webp'); /* Görselinizin dosya adı */
            background-size: cover; /* Resmi sündürmeden ekranı tamamen kapla */
            background-position: center; /* Resmin tam merkezini ekrana ortala */
            background-repeat: no-repeat; /* Resim küçükse kendini tekrar edip mozaik olmasın */
            background-attachment: fixed; /* Mobilde veya PC'de aşağı kaydırırken arkaplan sabit kalsın */
            
            background-color: #f3f4f6; /* Açık gri arkaplan */
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Beyaz form kutusunun tasarımı */
        .form-kutusu {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 200px 200px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .form2-kutusu {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 200px 200px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        
        /* Başlık tasarımı */
        h2 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #1f2937;
        }

        /* Input (Metin kutuları) alanları */
        .form-grubu {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            color: #374151;
            font-size: 0.875rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.25rem;
            box-sizing: border-box; /* Kutunun taşmasını engeller */
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3b82f6; /* Tıklanınca mavi çerçeve */
        }

        /* Buton tasarımı */
        button {
            width: 100%;
            background-color: black;
            color: white;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #2563eb; /* Üzerine gelince koyu mavi */
        }

        button:disabled {
            background-color: #9ca3af; /* Yüklenirken gri renk */
            cursor: not-allowed;
        }

        /* Hata ve Başarı Mesajı Renkleri */
        .mesaj-kutu { margin-top: 1rem; text-align: center; font-weight: bold; font-size: 1rem; }
        .gizli { display: none; }
        .basari-rengi { color: #16a34a; }
        .hata-rengi { color: #dc2626; }
    </style>
    </head>
<body>

    <div class="form-kutusu">
        <h2>Etkinlik Kayıt Formu</h2>
        
        <form id="basvuruFormu">
            <div class="form-grubu">
                <label>Adınız ve Soyadınız</label>
                <input type="text" name="Ad_Soyad" required>
            </div>
            
            <div class="form-grubu">
                <label>E-Posta Adresiniz</label>
                <input type="email" name="Email" required>
            </div>

            <button type="submit" id="submitBtn">Başvuruyu Tamamla</button>
        </form>

        <div id="sonucMesaji" class="mesaj-kutu gizli"></div>

        <div class="form2-kutusu">
             <div class="form-grubu">
            <h3>Po.E.T.A X ODA ART</h3>
                 </div>
            </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzPWTmT7UTWPRpS82fyC6cGUlXLE5H3ZFJafAewJ8P0hb7l6nLXwaSAD6fG3_N9NqEIgw/exec';
        const form = document.getElementById('basvuruFormu');
        const submitBtn = document.getElementById('submitBtn');
        const sonucMesaji = document.getElementById('sonucMesaji');

        form.addEventListener('submit', e => {
            e.preventDefault(); 
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Gönderiliyor...";

            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => response.json())
                .then(data => {
                    sonucMesaji.className = "mesaj-kutu"; // Sınıfları sıfırla
                    
                    if(data.result === "success") {
                        sonucMesaji.innerText = "Başvurunuz başarıyla alındı!";
                        sonucMesaji.classList.add('basari-rengi');
                        form.reset(); 
                    } else if (data.result === "error") {
                        sonucMesaji.innerText = data.message || data.error || "Kontenjan hatası veya sunucu problemi oluştu.";
                        sonucMesaji.classList.add('hata-rengi');
                    }
                    
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Başvuruyu Tamamla";
                })
                .catch(error => {
                    console.error('Hata!', error.message);
                    sonucMesaji.className = "mesaj-kutu hata-rengi";
                    sonucMesaji.innerText = "Bağlantı Hatası: " + error.message;
                    
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Tekrar Dene";
                });
        });
    </script>
</body>
</html>
