<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Başvurusu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Etkinlik Kayıt Formu</h2>
        
        <form id="basvuruFormu" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Adınız ve Soyadınız</label>
                <input type="text" name="Ad_Soyad" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">E-Posta Adresiniz</label>
                <input type="email" name="Email" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded hover:bg-blue-600 transition duration-300">
                Başvuruyu Tamamla
            </button>
        </form>

        <div id="sonucMesaji" class="mt-4 text-center font-bold hidden"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwOsdn3mrjN-8X0B0y4x3TIBqVippQnv9vl5JAkZ3p9z4V2X6itrocBWhm-1VvAUZZ4QA/exec';
        const form = document.getElementById('basvuruFormu');
        const submitBtn = document.getElementById('submitBtn');
        const sonucMesaji = document.getElementById('sonucMesaji');

        form.addEventListener('submit', e => {
            e.preventDefault(); // Sayfanın yenilenmesini engeller
            
            // Butonu yükleniyor durumuna al
            submitBtn.disabled = true;
            submitBtn.innerText = "Gönderiliyor...";
            submitBtn.classList.replace('bg-blue-500', 'bg-gray-400');

            // Form verilerini al ve Google'a yolla
            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => response.json())
                .then(data => {
                    sonucMesaji.className = "mt-4 text-center font-bold text-base"; // Sınıfları sıfırla
                    
                    if(data.result === "success") {
                        sonucMesaji.innerText = "Başvurunuz başarıyla alındı!";
                        sonucMesaji.classList.add('text-green-600');
                        form.reset(); // Formu temizle
                    } else if (data.result === "error") {
                        // 1. DÜZELTME: Google'dan dönen hata mesajını veya sistem hatasını burada yakalıyoruz.
                        sonucMesaji.innerText = data.message || data.error || "Kontenjan hatası veya sunucu problemi oluştu.";
                        sonucMesaji.classList.add('text-red-600');
                    }
                    
                    // Butonu eski haline getir
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Başvuruyu Tamamla";
                    submitBtn.classList.replace('bg-gray-400', 'bg-blue-500');
                })
                .catch(error => {
                    console.error('Hata!', error.message);
                    sonucMesaji.className = "mt-4 text-center font-bold text-base text-red-600";
                    // 2. DÜZELTME: .catch bloğu içinde 'data' yaşamaz, internet kesintisi gibi durumlar için 'error.message' kullanılır.
                    sonucMesaji.innerText = "Bağlantı Hatası: " + error.message;
                    
                    // Butonu eski haline getir (Hata durumunda buton kilitli kalmasın)
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Tekrar Dene";
                    submitBtn.classList.replace('bg-gray-400', 'bg-blue-500');
                });
        });
    </script>
</body>
</html>
